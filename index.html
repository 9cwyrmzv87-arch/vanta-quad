
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANTA</title>
<style>
body {
  background:#080808;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px 15px;
}
h1 {
  color:#ff7900;
  font-size:45px;
  letter-spacing:5px;
}
p {color:#aaa}
button,input {
  padding:14px;
  margin:8px;
  border-radius:10px;
  border:1px solid #ff7900;
  background:#151515;
  color:white;
  font-size:16px;
}
button {background:#ff7900;color:black;font-weight:bold}
#results {margin-top:20px}
.item {
  background:#171717;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>
<body>
<h1>VANTA</h1>
<p>FOUR LETTER USERNAME GENERATOR</p>

<input id="amount" type="number" value="20" min="1" max="100">
<button onclick="generate()">توليد اليوزرات</button>

<div id="results"></div>

<script>
function generate() {
 const chars="abcdefghijklmnopqrstuvwxyz0123456789._";
 const amount=Math.min(100,Math.max(1,Number(document.getElementById("amount").value)||20));
 const results=document.getElementById("results");
 results.innerHTML="";
 for(let i=0;i<amount;i++){
  let username="";
  for(let j=0;j<4;j++){
   username+=chars[Math.floor(Math.random()*chars.length)];
  }
  const item=document.createElement("div");
  item.className="item";
  item.textContent="@"+username;
  results.appendChild(item);
 }
}
</script>
</body>
</html>
